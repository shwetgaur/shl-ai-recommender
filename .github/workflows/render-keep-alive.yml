name: Render keep-alive

on:
  schedule:
    # Daily ping — Render free tier only sleeps instances (cold start OK); this
    # keeps the service visibly active without burning GitHub Actions minutes.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SHL recommender health
        run: |
          curl -fsS --retry 3 --retry-delay 15 --max-time 120 \
            "https://shl-conversational-assessment-recommender.onrender.com/health"
          echo "SHL recommender keep-alive OK"
