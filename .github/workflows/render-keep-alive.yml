name: Render keep-alive

# Scheduled pings moved to shwetgaur-portfolio (one workflow pings all Render apps).
# Use workflow_dispatch here for a manual ping of this service only.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SHL recommender health
        run: |
          curl -fsS --connect-timeout 15 --max-time 180 --retry 2 --retry-delay 25 \
            "https://shl-recommender-xffs.onrender.com/health"
          echo "SHL recommender keep-alive OK"
