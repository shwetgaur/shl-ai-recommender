<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHL Assessment Recommender</title>
  <style>
    :root {
      --bg: #0c0e12;
      --surface: #141820;
      --border: #252b38;
      --text: #e8eaed;
      --muted: #8b9298;
      --accent: #3d8bfd;
      --live: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      background: rgba(12, 14, 18, 0.95);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header p { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .samples button {
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .samples button:hover { border-color: var(--accent); color: var(--accent); }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 88%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .recs {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .rec {
      display: block;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(61, 139, 253, 0.08);
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
    }
    .rec:hover { border-color: var(--accent); }
    .rec span {
      display: inline-block;
      font-size: 0.65rem;
      font-family: monospace;
      color: var(--live);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 4px;
      padding: 0.1rem 0.35rem;
      margin-left: 0.5rem;
    }
    .typing { color: var(--muted); font-size: 0.85rem; font-style: italic; }
    form {
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem 1.25rem;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .input-row { display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button[type="submit"] {
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>SHL Assessment Recommender</h1>
    <p>Describe the role you're hiring for — get grounded SHL test recommendations.</p>
  </header>

  <div class="samples">
    <button type="button" data-prompt="We're hiring a mid-level Java developer who works with stakeholders.">Java developer</button>
    <button type="button" data-prompt="Need assessments for a customer service team — communication and empathy matter.">Customer service</button>
    <button type="button" data-prompt="Senior data analyst — SQL, Python, and business storytelling.">Data analyst</button>
    <button type="button" data-prompt="Graduate hire — cognitive ability and learning agility.">Graduate hire</button>
  </div>

  <div id="chat"></div>

  <form id="form">
    <div class="input-row">
      <input id="input" type="text" placeholder="Describe the role, skills, or seniority…" autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </div>
    <p class="hint">Up to 8 turns · Recommendations appear when the agent has enough context</p>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const messages = [];
    let ended = false;

    function renderRecs(recs) {
      if (!recs || !recs.length) return "";
      const items = recs.map(r =>
        `<a class="rec" href="${r.url}" target="_blank" rel="noopener">${r.name}<span>${r.test_type}</span></a>`
      ).join("");
      return `<div class="recs">${items}</div>`;
    }

    function append(role, text, recs) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.innerHTML = text + (role === "assistant" ? renderRecs(recs) : "");
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send(text) {
      if (!text.trim() || ended) return;
      messages.push({ role: "user", content: text.trim() });
      append("user", text.trim());
      input.value = "";
      sendBtn.disabled = true;
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "Thinking…";
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        typing.remove();
        messages.push({ role: "assistant", content: data.reply });
        append("assistant", data.reply, data.recommendations);
        if (data.end_of_conversation) {
          ended = true;
          input.disabled = true;
          sendBtn.disabled = true;
          input.placeholder = "Conversation complete";
        }
      } catch (e) {
        typing.remove();
        append("assistant", "Could not reach the server. Please try again.");
      }
      sendBtn.disabled = ended;
      input.focus();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      send(input.value);
    });

    document.querySelectorAll(".samples button").forEach((btn) => {
      btn.addEventListener("click", () => send(btn.dataset.prompt));
    });

    append("assistant", "Hi — tell me about the role you're hiring for (skills, seniority, or team context) and I'll suggest SHL assessments.");
  </script>
</body>
</html>
